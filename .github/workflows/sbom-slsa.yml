# Laboratorio 246 - Supply chain security: SBOM y SLSA
#
# 1. build:                 construye y publica la imagen en GHCR, genera SBOM (CycloneDX y SPDX)
#                           del código y de la imagen, escanea con Grype, adjunta el SBOM como
#                           atestación firmada con cosign (keyless) y la verifica.
# 2. procedencia:           genera procedencia SLSA Build L3 firmada con el builder oficial
#                           slsa-github-generator y la sube al registro junto a la imagen.
# 3. verificar-procedencia: verifica la procedencia con slsa-verifier (repo + rama + builder).
#
# Buenas prácticas aplicadas: permisos mínimos por job, actions fijadas por SHA de commit,
# firma por digest (nunca por tag), runners efímeros de GitHub y verificación con identidad exacta.

name: sbom-slsa

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'evidencias/**'
      - 'reports/**'
  workflow_dispatch:
    inputs:
      go_version:
        description: 'Versión de Go para compilar (1.22 = la de la guía)'
        required: false
        default: '1.22'
      fallar_en:
        description: 'Quality gate de Grype: falla si hay vulnerabilidades de esta severidad o superior'
        required: false
        default: 'ninguno'
        type: choice
        options: ['ninguno', 'medium', 'high', 'critical']

# Sin permisos por defecto: cada job pide solo lo que necesita
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # bash con -eo pipefail

env:
  APP_VERSION: '1.0.0'
  GO_VERSION: ${{ inputs.go_version || '1.22' }}

jobs:
  build:
    name: Build, SBOM, escaneo y atestación
    runs-on: ubuntu-latest
    permissions:
      contents: read     # leer el código
      packages: write    # publicar la imagen y la atestación en GHCR
      id-token: write    # token OIDC para la firma keyless de cosign
    outputs:
      image: ${{ steps.nombre.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: nombre
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Evita el artefacto .dockerbuild extra; los entregables son los SBOM y la procedencia
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ env.APP_VERSION }}
          tags: |
            ${{ steps.nombre.outputs.image }}:${{ env.APP_VERSION }}
            ${{ steps.nombre.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
          # La procedencia y el SBOM los generamos nosotros (SLSA L3 y Syft) en lugar de BuildKit
          provenance: false
          sbom: false

      - name: Instalar Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: SBOM del código (CycloneDX y SPDX)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p reports
          "$SYFT" dir:. \
            --exclude './reports/**' --exclude './.git/**' \
            --source-name lab246 --source-version "$APP_VERSION" \
            -o cyclonedx-json=reports/sbom-codigo.cdx.json \
            -o spdx-json=reports/sbom-codigo.spdx.json

      - name: SBOM de la imagen publicada (CycloneDX y SPDX)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          REF: ${{ steps.nombre.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          # Se genera en el mismo job que produce el artefacto y sobre el digest exacto publicado
          "$SYFT" "$REF" --from registry \
            -o cyclonedx-json=reports/sbom-imagen.cdx.json \
            -o spdx-json=reports/sbom-imagen.spdx.json \
            -o table

      - name: Instalar Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Escanear el SBOM con Grype
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          "$GRYPE" sbom:reports/sbom-imagen.cdx.json \
            -o table -o json=reports/grype-resultados.json | tee reports/grype-resultados.txt

      - name: Instalar cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Adjuntar el SBOM como atestación firmada (keyless)
        env:
          REF: ${{ steps.nombre.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          # Formato clásico (etiqueta .att): GHCR no implementa la API de referrers de OCI 1.1
          cosign attest --yes \
            --new-bundle-format=false --use-signing-config=false \
            --predicate reports/sbom-imagen.cdx.json \
            --type cyclonedx \
            "$REF" 2>&1 | tee reports/cosign-attest.txt

      - name: Verificar la atestación con la identidad exacta del workflow
        env:
          REF: ${{ steps.nombre.outputs.image }}@${{ steps.build.outputs.digest }}
          IDENTIDAD: https://github.com/${{ github.workflow_ref }}
        run: |
          echo "Firmante esperado: $IDENTIDAD"
          if ! cosign verify-attestation \
                --new-bundle-format=false \
                --type cyclonedx \
                --certificate-identity "$IDENTIDAD" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$REF" > reports/atestacion-sbom-ci.jsonl 2> reports/cosign-verify-ci.txt; then
            cat reports/cosign-verify-ci.txt
            exit 1
          fi
          cat reports/cosign-verify-ci.txt
          echo "--- Declaración in-toto verificada ---"
          jq -r '.payload | @base64d | fromjson
                 | "predicateType: \(.predicateType)\nsubject:       \(.subject[0].name)@sha256:\(.subject[0].digest.sha256)\ncomponentes:   \(.predicate.components | length)"' \
            reports/atestacion-sbom-ci.jsonl

      - name: Publicar SBOM CycloneDX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: |
            reports/sbom-codigo.cdx.json
            reports/sbom-imagen.cdx.json
          if-no-files-found: error

      - name: Publicar SBOM SPDX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: |
            reports/sbom-codigo.spdx.json
            reports/sbom-imagen.spdx.json
          if-no-files-found: error

      - name: Publicar resultados de Grype y cosign
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escaneo-y-atestacion
          path: |
            reports/grype-resultados.json
            reports/grype-resultados.txt
            reports/cosign-attest.txt
            reports/cosign-verify-ci.txt
            reports/atestacion-sbom-ci.jsonl
          if-no-files-found: error

      - name: Resumen del job
        env:
          REF: ${{ steps.nombre.outputs.image }}@${{ steps.build.outputs.digest }}
          IDENTIDAD: https://github.com/${{ github.workflow_ref }}
        run: |
          {
            echo "## Imagen publicada"
            echo '```'
            echo "$REF"
            echo '```'
            echo "Go usado para compilar: \`$GO_VERSION\`"
            echo
            echo "## SBOM"
            echo "| Origen | Componentes |"
            echo "|---|---|"
            echo "| Código | $(jq '.components | length' reports/sbom-codigo.cdx.json) |"
            echo "| Imagen | $(jq '.components | length' reports/sbom-imagen.cdx.json) |"
            echo
            echo "## Vulnerabilidades (Grype)"
            echo "| Severidad | Cantidad |"
            echo "|---|---|"
            jq -r '[.matches[].vulnerability.severity] | group_by(.) | map("| \(.[0]) | \(length) |") | .[]' \
              reports/grype-resultados.json
            echo "| **Total** | **$(jq '.matches | length' reports/grype-resultados.json)** |"
            echo
            echo "## Atestación SBOM"
            echo "Firmada con cosign keyless y verificada con identidad \`$IDENTIDAD\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Quality gate de vulnerabilidades (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fallar_en != 'ninguno' }}
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          FALLAR_EN: ${{ inputs.fallar_en }}
        run: '"$GRYPE" sbom:reports/sbom-imagen.cdx.json --fail-on "$FALLAR_EN" -o table'

  procedencia:
    name: Procedencia SLSA Build L3
    needs: build
    permissions:
      actions: read      # detectar el entorno de GitHub Actions
      id-token: write    # firmar la procedencia con OIDC
      packages: write    # subir la procedencia a GHCR
    # El generador oficial debe referenciarse por tag de versión (requisito del propio generador)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}
      # Permite que el generador funcione también si el repositorio es privado.
      # El nombre del repo ya queda en el log público Rekor por la firma keyless de cosign.
      private-repository: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verificar-procedencia:
    name: Verificar procedencia SLSA
    needs: [build, procedencia]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Instalar slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1

      - name: Login en GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar con slsa-verifier
        env:
          REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p reports
          if ! slsa-verifier verify-image "$REF" \
                --source-uri "github.com/$REPO" \
                --source-branch "$RAMA" \
                --print-provenance > reports/procedencia-slsa.json 2> reports/slsa-verifier.txt; then
            cat reports/slsa-verifier.txt
            exit 1
          fi
          cat reports/slsa-verifier.txt
          echo "--- Procedencia verificada ---"
          jq -r '"predicateType: \(.predicateType)",
                 "builder:       \(.predicate.builder.id // .predicate.runDetails.builder.id)",
                 "buildType:     \(.predicate.buildType // .predicate.buildDefinition.buildType)"' \
            reports/procedencia-slsa.json

      - name: Publicar procedencia SLSA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: procedencia-slsa
          path: |
            reports/procedencia-slsa.json
            reports/slsa-verifier.txt
          if-no-files-found: error

      - name: Resumen SLSA
        env:
          REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.ref_name }}
        run: |
          BUILDER=$(jq -r '.predicate.builder.id // .predicate.runDetails.builder.id' reports/procedencia-slsa.json)
          {
            echo "## Procedencia SLSA verificada"
            echo "- Imagen: \`$REF\`"
            echo "- Builder: \`$BUILDER\`"
            echo "- Fuente: \`github.com/$REPO\` rama \`$RAMA\` commit \`$GITHUB_SHA\`"
            echo
            echo "| Nivel | Requisito | Evidencia | Estado |"
            echo "|---|---|---|---|"
            echo "| Build L1 | Existe procedencia | \`procedencia-slsa.json\` | Cumple |"
            echo "| Build L2 | Plataforma alojada y procedencia firmada | GitHub Actions + firma Sigstore verificada | Cumple |"
            echo "| Build L3 | Builder endurecido y aislado | slsa-github-generator (workflow reutilizable aislado) | Cumple |"
          } >> "$GITHUB_STEP_SUMMARY"
